name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build publishToMavenLocal --no-daemon
      - run: mvn -B -f byterails-maven-plugin/pom.xml verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            */build/reports/tests/**
            */build/reports/byterails/**
            byterails-maven-plugin/target/it/*/build.log
