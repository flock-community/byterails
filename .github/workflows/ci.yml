name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build publishToMavenLocal --no-daemon
      - run: mvn -B -f byterails-maven-plugin/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            */build/reports/tests/**
            */build/reports/byterails/**
            byterails-maven-plugin/target/it/*/build.log
