# Publishes byterails-core, the Gradle plugin and the Maven plugin to Maven Central.
#
#   push to main        -> the SNAPSHOT version from gradle.properties, to the Central snapshot repository
#   GitHub release      -> the release tag (a leading "v" is dropped), released on Maven Central
#   manual dispatch     -> the version typed in
#
# Secrets, the same names kmapper uses: SONATYPE_USERNAME and SONATYPE_PASSWORD (a Central Portal
# user token), GPG_PRIVATE_KEY (ASCII-armored private key) and GPG_PASSPHRASE.
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string
      components:
        description: 'What to publish; use maven to finish a release whose Gradle half already went out'
        required: false
        default: all
        type: choice
        options: [all, gradle, maven]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        run: |
          case "${{ github.event_name }}" in
            release)          VERSION="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) VERSION="${{ github.event.inputs.version }}" ;;
            *)                VERSION="$(grep '^version=' gradle.properties | cut -d= -f2)" ;;
          esac
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Deploying byterails $VERSION"

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION"

      # A release version that is already on Maven Central is skipped, so a run that fails halfway
      # can be repeated and finishes the half that is missing instead of being rejected as a duplicate.
      - name: Check what this version already has on Maven Central
        run: |
          base="https://repo1.maven.org/maven2/community/flock/byterails"
          probe() { curl -sS -o /dev/null -w '%{http_code}' "$base/$1/$VERSION/$1-$VERSION.pom"; }
          case "$VERSION" in
            *-SNAPSHOT) gradle=404; maven=404 ;;
            *) gradle="$(probe byterails-core)"; maven="$(probe byterails-maven-plugin)" ;;
          esac
          echo "GRADLE_PUBLISHED=$([ "$gradle" = 200 ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "MAVEN_PUBLISHED=$([ "$maven" = 200 ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "core on Central: $gradle, maven plugin on Central: $maven"

      - name: Publish core and Gradle plugin to Maven Central
        if: github.event.inputs.components != 'maven' && env.GRADLE_PUBLISHED != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # The Nexus publish plugin is not configuration-cache compatible: with the cache on, Gradle publishes
        # and releases, then fails the build while storing the cache, which skipped the Maven steps in run 1.
        run: ./gradlew -Pversion="$VERSION" --no-configuration-cache publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Publish core locally for the Maven plugin build
        if: github.event.inputs.components != 'gradle' && env.MAVEN_PUBLISHED != 'true'
        run: ./gradlew -Pversion="$VERSION" --no-configuration-cache publishToMavenLocal

      - name: Import GPG key
        if: github.event.inputs.components != 'gradle' && env.MAVEN_PUBLISHED != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Maven settings
        if: github.event.inputs.components != 'gradle' && env.MAVEN_PUBLISHED != 'true'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Publish Maven plugin to Maven Central
        if: github.event.inputs.components != 'gradle' && env.MAVEN_PUBLISHED != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f byterails-maven-plugin/pom.xml -Drevision="$VERSION" -Prelease deploy
